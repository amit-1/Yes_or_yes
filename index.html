<!DOCTYPE html>
<html>
<head>
    <title>Do You Love Me?</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 150px;
            background-color: #ffe6f0;
        }

        h1 {
            font-size: 40px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 20px;
            margin: 20px;
            cursor: pointer;
            position: absolute;
        }

        #yesBtn {
            position: static;
            background-color: #ff4d6d;
            color: white;
            border: none;
            border-radius: 10px;
        }

        #noBtn {
            background-color: #444;
            color: white;
            border: none;
            border-radius: 10px;
        }

        #message {
            margin-top: 100px;
            font-size: 30px;
            font-weight: bold;
            color: #d6336c;
        }
    </style>
</head>
<body>

<h1>Do you love me? ❤️</h1>

<button id="yesBtn" class="btn" onclick="sayYes()">Yes</button>
<button id="noBtn" class="btn" onmouseover="moveButton()">No</button>

<div id="message"></div>

<script>
    function moveButton() {
        const button = document.getElementById("noBtn");
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 100);
        button.style.left = x + "px";
        button.style.top = y + "px";
    }

    function sayYes() {
        document.body.innerHTML = "<h1 style='margin-top:200px; font-size:50px; color:#ff1e56;'>I knew it!!! ❤️😍</h1>";
    }
</script>

</body>
</html>
